const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(key){
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD));
  // AES-GCM authenticates the payload: a tampered page fails to decrypt, so only our own build
  // output is ever parsed here.
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(plain),"text/html");
  document.documentElement.replaceWith(document.adoptNode(doc.documentElement));
  for(const old of document.querySelectorAll("script")){
    const s=document.createElement("script");
    for(const at of old.attributes) s.setAttribute(at.name,at.value);
    s.textContent=old.textContent; old.replaceWith(s);
  }
  if(location.hash){ const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
}
async function tryStored(){
  let raw=null; try{raw=sessionStorage.getItem(KEYNAME);}catch(e){}
  if(!raw) return false;
  try{ const key=await crypto.subtle.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]); await openWith(key); return true; }
  catch(e){ try{sessionStorage.removeItem(KEYNAME);}catch(_){} return false; }
}
tryStored().then(ok=>{
  if(ok) return;
  const gate=document.getElementById("gate"), pw=document.getElementById("pw"), go=document.getElementById("go"), msg=document.getElementById("msg");
  gate.hidden=false; pw.focus();
  document.getElementById("f").addEventListener("submit",async e=>{
    e.preventDefault(); const pass=pw.value.trim(); if(!pass) return;
    go.disabled=true; msg.className="msg work"; msg.textContent="Unlocking…";
    try{
      const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
      await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(PAYLOAD));
      const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      try{sessionStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw)));}catch(_){}
      await openWith(key);
    }catch(err){ go.disabled=false; msg.className="msg"; msg.textContent="That password did not work. Check it and try again."; pw.select(); }

});
